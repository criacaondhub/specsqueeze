<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="canonical" href="https://b2b.squeeze.com.br/" />
  <meta name="robots" content="index, follow" />

  <!-- Critical CSS: fundo escuro imediato para evitar flash branco -->
  <style>
    body {
      background-color: #070d16;
      margin: 0;
    }

    @font-face {
      font-family: 'Figtree';
      font-display: swap;
      src: url('https://fonts.gstatic.com/s/figtree/v5/aem7-VhKiyGlL0WbDkaamqpfl7hNcPdC.woff2') format('woff2');
      font-weight: 400 700;
    }
  </style>

  <!-- Preload LCP images (desktop + mobile) -->
  <link rel="preload" as="image" href="/assets/squeeze.webp" media="(min-width: 768px)" fetchpriority="high" />
  <link rel="preload" as="image" href="/assets/hero-mobile.webp" media="(max-width: 767px)" fetchpriority="high" />

  <!-- Fonts (não-bloqueante) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700&display=swap" rel="stylesheet" media="print"
    onload="this.media='all'" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700&display=swap" rel="stylesheet" />
  </noscript>

  <!-- Primary Meta Tags -->
  <title>Spec Squeeze | Brindes Personalizados para Empresas</title>
  <meta name="title" content="Spec Squeeze | Brindes Personalizados para Empresas" />
  <meta name="description"
    content="Squeezes de alto padrão para eventos, ações de marketing e parcerias estratégicas. Pedido mínimo de 300 unidades. Atendimento exclusivo B2B." />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://b2b.squeeze.com.br/" />
  <meta property="og:title" content="Spec Squeeze | Brindes Personalizados para Empresas" />
  <meta property="og:description"
    content="Squeezes de alto padrão para eventos, ações de marketing e parcerias estratégicas. Pedido mínimo de 300 unidades. Atendimento exclusivo B2B." />
  <meta property="og:image" content="https://b2b.squeeze.com.br/assets/og-spec.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="600" />
  <meta property="og:image:type" content="image/png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://b2b.squeeze.com.br/" />
  <meta property="twitter:title" content="Spec Squeeze | Brindes Personalizados para Empresas" />
  <meta property="twitter:description"
    content="Squeezes de alto padrão para eventos, ações de marketing e parcerias estratégicas. Pedido mínimo de 300 unidades. Atendimento exclusivo B2B." />
  <meta property="twitter:image" content="https://b2b.squeeze.com.br/assets/og-spec.png" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
