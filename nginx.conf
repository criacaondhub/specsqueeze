server {
    listen 80;
    server_name b2b.squeeze.com.br;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Arquivos SEO estáticos (devem ser servidos diretamente, sem fallback)
    location = /robots.txt {
        access_log off;
        log_not_found off;
        default_type text/plain;
    }

    location = /sitemap.xml {
        access_log off;
        log_not_found off;
        default_type application/xml;
    }

    # Cache agressivo para assets estáticos (JS, CSS, imagens) — 1 ano
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback — HTML sempre sem cache
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
