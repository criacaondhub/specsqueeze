server {
    listen 80;
    server_name b2b.squeeze.com.br;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Cache agressivo para assets estáticos (JS, CSS, imagens) — 1 ano
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cache curto para HTML (sempre buscar a versão mais recente)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Preload de fontes
    location ~* \.(woff2)$ {
        add_header Link "</assets/fonts/figtree.woff2>; rel=preload; as=font; crossorigin";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
